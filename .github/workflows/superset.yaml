name: Superset CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy filesystem scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret,misconfig'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        # Code scanning is not available on private repositories without GitHub Advanced Security.
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  validate:
    name: Validate Assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate JSON files
        run: |
          find . -name "*.json" -type f -not -path "./.git/*" -print0 |
            while IFS= read -r -d '' file; do
              echo "Validating: $file"
              python -m json.tool "$file" > /dev/null
            done
          echo "All JSON files are valid"

      - name: Validate Superset assets
        run: python -m scripts.validate

      - name: Run tests
        run: pytest -v

  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements*.txt

      - name: Install linters
        run: pip install -r requirements-dev.txt

      - name: Check formatting
        run: |
          black --check scripts/ tests/
          isort --check-only scripts/ tests/
          flake8 scripts/ tests/

  superset:
    name: Resolve Superset Instance
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      configured: ${{ steps.resolve.outputs.configured }}
    steps:
      - name: Check for Superset credentials
        id: resolve
        env:
          SUPERSET_URL: ${{ vars.SUPERSET_URL || secrets.SUPERSET_URL }}
          SUPERSET_USERNAME: ${{ secrets.SUPERSET_USERNAME }}
          SUPERSET_PASSWORD: ${{ secrets.SUPERSET_PASSWORD }}
        run: |
          if [ -n "$SUPERSET_URL" ] && [ -n "$SUPERSET_USERNAME" ] && [ -n "$SUPERSET_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SUPERSET_URL, SUPERSET_USERNAME and SUPERSET_PASSWORD are not all set: the deployment is skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Deploy to Superset
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [validate, lint, superset]
    if: needs.superset.outputs.configured == 'true'
    environment: development
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import to Superset
        run: python -m scripts.import
        env:
          SUPERSET_URL: ${{ vars.SUPERSET_URL || secrets.SUPERSET_URL }}
          SUPERSET_USERNAME: ${{ secrets.SUPERSET_USERNAME }}
          SUPERSET_PASSWORD: ${{ secrets.SUPERSET_PASSWORD }}
          SUPERSET_DATABASE_URI: ${{ secrets.SUPERSET_DATABASE_URI }}

