name: Packer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKER_VERSION: '1.16.2'

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Check formatting
        run: packer fmt -check -diff -recursive .

      - name: Install plugins
        run: packer init .
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Checks the whole template, plugins included, without contacting the
      # provider.
      - name: Validate template
        run: packer validate .

  scripts:
    name: Lint provisioning scripts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check shell syntax
        run: bash -n scripts/provision.sh

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Scan for committed secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: '1'

  # A build needs access to the provider. Until it is configured the build is
  # skipped, so a new repository is green from its first push.
  credentials:
    name: Check build credentials
    runs-on: ubuntu-24.04
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Look for build credentials
        id: check
        env:
          REQUIRED: ${{ secrets.AWS_ROLE_ARN }}
          MISSING: AWS_ROLE_ARN
        run: |
          if [ -n "$REQUIRED" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Image build skipped. Set the repository secrets $MISSING to enable it."
          fi

  build:
    name: Build image
    needs: [validate, scripts, secret-scan, credentials]
    if: needs.credentials.outputs.available == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install plugins
        run: packer init .
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: packer build -color=false .

      - name: Upload build manifest
        uses: actions/upload-artifact@v6
        with:
          name: packer-manifest
          path: manifest.json
